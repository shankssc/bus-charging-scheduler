# Ruff configuration
# Run: ruff check . && ruff format .

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long — handled by formatter
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"