# scenario_4.yaml — Operator Heavy
# KPN dominates the BLR→KCH fleet (8 of 10 buses).
# Operator weight elevated to 2.0 — KPN fleet fairness is amplified.
# Expected: KPN buses get systematic priority at queue conflicts.
# Dropping operator weight to 1.0 should produce visibly different queue orders.

